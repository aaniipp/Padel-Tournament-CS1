<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Padel Tournament — Local tournament management and live scoring platform">
    <title>Padel Tournament</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- ==================== HOME PAGE ==================== -->
    <div id="page-home" class="page active">
        <div class="page-header">
            <h1>🏆 Padel</h1>
            <button class="btn btn-sm btn-primary" onclick="showTournamentSetup()">+ Tournament</button>
        </div>
        <div id="home-content"></div>
    </div>

    <!-- ==================== LIVE MATCH PAGE ==================== -->
    <div id="page-match" class="page">
        <div class="page-header">
            <h1>⚡ Live Match</h1>
            <button class="btn btn-sm btn-outline" onclick="showMatchSetup()">+ New</button>
        </div>
        <div id="match-content"></div>
    </div>

    <!-- ==================== TOURNAMENT / STANDINGS PAGE ==================== -->
    <div id="page-standings" class="page">
        <div class="page-header">
            <h1>📊 Tournament</h1>
            <button class="btn btn-sm btn-outline" onclick="showTournamentSetup()">+ New</button>
        </div>
        <div id="standings-content"></div>
    </div>

    <!-- ==================== PLAYERS SETUP PAGE ==================== -->
    <div id="page-setup" class="page">
        <div class="page-header">
            <h1>⚙️ Players</h1>
        </div>
        <div id="setup-content"></div>
    </div>

    <!-- ==================== BOTTOM NAVIGATION ==================== -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home" aria-label="Home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="match" aria-label="Live Match">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Match</span>
        </button>
        <button class="nav-item" data-page="standings" aria-label="Tournament">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Tournament</span>
        </button>
        <button class="nav-item" data-page="setup" aria-label="Players Setup">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Players</span>
        </button>
    </nav>
</div>

<!-- ==================== CONFIRMATION MODAL ==================== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h3 class="modal-title" id="modal-title">Confirm</h3>
        <p class="modal-message" id="modal-message">Are you sure?</p>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modal-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
        </div>
    </div>
</div>

<!-- ==================== TOAST NOTIFICATION ==================== -->
<div id="toast" class="toast" role="alert"></div>

<!-- ==================== WIZARD / ACTION SHEET ==================== -->
<div class="modal-overlay" id="wizard-overlay">
    <div class="modal" style="max-width:440px;max-height:88vh;overflow-y:auto;">
        <div class="flex flex-between" style="align-items:center;margin-bottom:8px;">
            <h3 id="wiz-title">Setup</h3>
            <button class="btn btn-icon btn-ghost" id="wiz-close" aria-label="Close dialog">✕</button>
        </div>
        <small class="text-muted" id="wiz-step"></small>
        <div id="wizard-body" style="margin-top:16px;min-height:160px;"></div>
        <div class="flex gap-sm" style="margin-top:20px;">
            <button class="btn btn-outline flex-1" id="wiz-back" style="display:none;">← Back</button>
            <button class="btn btn-primary flex-1" id="wiz-next">Next →</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
